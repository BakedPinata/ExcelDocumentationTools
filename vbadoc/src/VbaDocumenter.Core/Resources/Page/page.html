<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page is self-contained: this policy makes the browser refuse any network request. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:">
<meta name="generator" content="{{TOOL_VERSION}}">
<title>{{TITLE}}</title>
<link rel="icon" type="image/svg+xml" href="{{FAVICON}}">
<script>
// Set the theme before the page is drawn, so it doesn't flash. A choice made with the switch wins; otherwise
// follow the system, and use dark when the browser doesn't report a preference.
(function () {
  var theme = null;
  try { theme = localStorage.getItem("vbadoc-theme"); } catch (e) { /* storage can be blocked on file:// */ }
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>
{{STYLE}}
</style>
</head>
<body>
<header class="topbar">
  <h1 class="title" id="page-title">{{TITLE}}</h1>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" id="tab-graph" aria-controls="view-graph" aria-selected="true">Dependency graph</button>
    <button type="button" role="tab" id="tab-classes" aria-controls="view-classes" aria-selected="false" tabindex="-1">Class diagram</button>
  </nav>
  <div class="search">
    <label for="search" class="visually-hidden">Find a module or member</label>
    <input id="search" type="search" list="search-list" placeholder="Find module or member…" autocomplete="off" spellcheck="false">
    <datalist id="search-list"></datalist>
  </div>
  <div class="source-status" id="source-status">
    <label class="button" id="load-folder-label">
      <input type="file" id="load-folder" webkitdirectory multiple>
      Load folder
    </label>
    <span id="source-status-text" class="muted"></span>
  </div>
  <div class="topbar-end">
    <button type="button" class="button source-toggle" id="source-toggle" aria-pressed="true" aria-controls="source-panel" title="Show or hide the source panel">Source</button>
    <button type="button" class="button theme-toggle" id="theme-toggle" aria-pressed="false" title="Switch between light and dark">
      <span class="theme-icon" aria-hidden="true"></span><span class="theme-label">Dark</span>
    </button>
    <a class="tool-version" id="tool-version" href="{{REPOSITORY_URL}}" target="_blank" rel="noopener noreferrer" title="{{TOOL_VERSION_DESCRIPTION}} Opens vbadoc on GitHub.">
      <svg class="github-mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span>{{TOOL_VERSION}}</span>
    </a>
  </div>
</header>
<nav class="trail" id="trail" aria-label="Trail" hidden>
  <ol class="trail-steps" id="trail-steps"></ol>
  <button type="button" class="trail-clear" id="trail-clear" title="Start the trail again from here" aria-label="Clear the trail">&times;</button>
</nav>
<main class="layout" id="layout">
  <section class="view" id="view-graph" role="tabpanel" aria-labelledby="tab-graph">
    <div class="view-toolbar" role="toolbar" aria-label="Graph options">
      <div class="segmented" role="radiogroup" aria-label="Level">
        <button type="button" role="radio" data-level="modules" aria-checked="true">Modules</button>
        <button type="button" role="radio" data-level="members" aria-checked="false">Members</button>
      </div>
      <div class="segmented" role="radiogroup" aria-label="Highlight">
        <button type="button" role="radio" data-reach="direct" aria-checked="true" title="Highlight direct dependencies and dependents">Direct</button>
        <button type="button" role="radio" data-reach="transitive" aria-checked="false" title="Highlight the whole chain in each direction">Transitive</button>
      </div>
      <div class="segmented" role="radiogroup" aria-label="Direction">
        <button type="button" role="radio" data-direction="all" aria-checked="true" title="Highlight dependencies and dependents">All</button>
        <button type="button" role="radio" data-direction="dependencies" aria-checked="false" title="Highlight only what the selection uses">Dependencies</button>
        <button type="button" role="radio" data-direction="dependents" aria-checked="false" title="Highlight only what uses the selection">Dependents</button>
      </div>
      <button type="button" class="button" id="graph-focus" aria-pressed="false" disabled title="Show only the selection and what it's connected to">Focus</button>
      <button type="button" class="button" id="graph-path" aria-pressed="false" disabled aria-label="Path from Home" title="Show the shortest chain of dependencies between Home and the selection"><span class="star" aria-hidden="true">★</span> Path</button>
      <button type="button" class="button" id="graph-fit" title="Zoom to fit">Fit</button>
      <details class="graph-filters dropdown" id="graph-filters">
        <summary class="button">Show…</summary>
        <div class="menu show-menu" id="graph-filter-menu"></div>
      </details>
      <details class="graph-filters graph-settings dropdown" id="graph-settings">
        <summary class="button" title="How the graph looks and behaves">Settings</summary>
        <div class="menu settings-menu" id="graph-settings-menu"></div>
      </details>
      <span class="toolbar-note" id="graph-path-note" role="status" hidden></span>
    </div>
    <svg class="graph-svg graph-art" id="graph-svg" aria-label="Dependency graph"></svg>
    <p class="view-message" id="graph-message" hidden></p>
    <details class="view-legend" id="graph-legend" open><summary>Legend</summary><div id="graph-legend-body"></div></details>
    <div class="graph-tooltip" id="graph-tooltip" hidden></div>
  </section>
  <section class="view" id="view-classes" role="tabpanel" aria-labelledby="tab-classes" hidden>
    <div class="view-toolbar" role="toolbar" aria-label="Class diagram options">
      <button type="button" class="button" id="classes-focus" aria-pressed="false" disabled title="Show only the selected module and the modules related to it">Focus</button>
      <div class="segmented" role="group" aria-label="Zoom">
        <button type="button" id="classes-zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button type="button" id="classes-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      </div>
      <button type="button" class="button" id="classes-fit" title="Zoom to fit">Fit</button>
      <details class="graph-filters dropdown" id="classes-filters">
        <summary class="button">Show…</summary>
        <div class="menu" id="classes-filter-menu"></div>
      </details>
      <span class="toolbar-note" id="classes-note" role="status" hidden></span>
    </div>
    <div class="classes-canvas" id="classes-canvas" aria-label="Class diagram"></div>
    <p class="view-message" id="classes-message" hidden></p>
    <details class="view-legend" id="classes-legend" open><summary>Legend</summary><div id="classes-legend-body"></div></details>
  </section>
  <div class="splitter" id="source-splitter" role="separator" tabindex="0" aria-controls="source-panel"
       aria-orientation="vertical" aria-label="Resize the source panel" aria-valuemin="20" aria-valuemax="70" aria-valuenow="42"
       title="Drag to resize. Double-click to reset."></div>
  <aside class="source-panel" id="source-panel" aria-label="Source">
    <button type="button" class="source-close" id="source-close" title="Hide the source panel" aria-label="Hide the source panel">&times;</button>
    <div class="source-header" id="source-header"></div>
    <div class="source-body" id="source-body"></div>
  </aside>
</main>
<script type="application/json" id="vbadoc-data">
{{DATA}}
</script>
{{SOURCES}}
{{SCRIPTS}}
</body>
</html>
