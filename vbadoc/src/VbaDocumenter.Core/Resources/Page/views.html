  <section class="view" id="view-graph" role="tabpanel" aria-labelledby="tab-graph">
    <div class="view-toolbar" role="toolbar" aria-label="Graph options">
      <div class="segmented" role="radiogroup" aria-label="Level">
        <button type="button" role="radio" data-level="modules" aria-checked="true">Modules</button>
        <button type="button" role="radio" data-level="members" aria-checked="false">Members</button>
      </div>
      <div class="segmented" role="radiogroup" aria-label="Highlight">
        <button type="button" role="radio" data-reach="direct" aria-checked="true" title="Highlight direct dependencies and dependents">Direct</button>
        <button type="button" role="radio" data-reach="transitive" aria-checked="false" title="Highlight the whole chain in each direction">Transitive</button>
      </div>
      <div class="segmented" role="radiogroup" aria-label="Direction">
        <button type="button" role="radio" data-direction="all" aria-checked="true" title="Highlight dependencies and dependents">All</button>
        <button type="button" role="radio" data-direction="dependencies" aria-checked="false" title="Highlight only what the selection uses">Dependencies</button>
        <button type="button" role="radio" data-direction="dependents" aria-checked="false" title="Highlight only what uses the selection">Dependents</button>
      </div>
      <button type="button" class="button" id="graph-focus" aria-pressed="false" disabled title="Show only the selection and what it's connected to">Focus</button>
      <button type="button" class="button" id="graph-path" aria-pressed="false" disabled aria-label="Path from Home" title="Show the shortest chain of dependencies between Home and the selection"><span class="star" aria-hidden="true">★</span> Path</button>
      <button type="button" class="button" id="graph-fit" title="Zoom to fit">Fit</button>
      <details class="graph-filters dropdown" id="graph-filters">
        <summary class="button">Show…</summary>
        <div class="menu show-menu" id="graph-filter-menu"></div>
      </details>
      <details class="graph-filters graph-settings dropdown" id="graph-settings">
        <summary class="button" title="How the graph looks and behaves">Settings</summary>
        <div class="menu settings-menu" id="graph-settings-menu"></div>
      </details>
      <span class="toolbar-note" id="graph-path-note" role="status" hidden></span>
    </div>
    <svg class="graph-svg graph-art" id="graph-svg" aria-label="Dependency graph"></svg>
    <p class="view-message" id="graph-message" hidden></p>
    <details class="view-legend" id="graph-legend" open><summary>Legend</summary><div id="graph-legend-body"></div></details>
    <div class="graph-tooltip" id="graph-tooltip" hidden></div>
  </section>
  <section class="view" id="view-classes" role="tabpanel" aria-labelledby="tab-classes" hidden>
    <div class="view-toolbar" role="toolbar" aria-label="Class diagram options">
      <button type="button" class="button" id="classes-focus" aria-pressed="false" disabled title="Show only the selected module and the modules related to it">Focus</button>
      <div class="segmented" role="group" aria-label="Zoom">
        <button type="button" id="classes-zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button type="button" id="classes-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      </div>
      <button type="button" class="button" id="classes-fit" title="Zoom to fit">Fit</button>
      <button type="button" class="button" id="classes-relayout" title="Forget where boxes were moved, and lay the diagram out again">Re-run layout</button>
      <details class="graph-filters dropdown" id="classes-filters">
        <summary class="button">Show…</summary>
        <div class="menu" id="classes-filter-menu"></div>
      </details>
    </div>
    <svg class="classes-svg" id="classes-svg" aria-label="Class diagram">
      <defs>
        <marker id="classes-arrow-realization" viewBox="0 -6 12 12" refX="11" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,-5.5 L11,0 L0,5.5 Z"></path></marker>
        <marker id="classes-arrow-association" viewBox="0 -6 12 12" refX="11" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,-4.5 L11,0 L1,4.5"></path></marker>
        <marker id="classes-arrow-dependency" viewBox="0 -6 12 12" refX="11" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,-4.5 L11,0 L1,4.5"></path></marker>
      </defs>
      <g class="viewport"><g class="edges"></g><g class="boxes"></g><g class="edge-labels"></g></g>
    </svg>
    <details class="view-legend" id="classes-legend" open><summary>Legend</summary><div id="classes-legend-body"></div></details>
  </section>
